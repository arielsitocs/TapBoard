name: Compilar prueba

# Compila TapBoard.exe en cualquier rama que no sea main, sin publicar nada.
# El .exe queda como archivo descargable en la ejecución (pestaña Actions →
# la ejecución → "Artifacts"). Las apps instaladas no lo ven como actualización.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Revisar código (go vet)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./... || true

      - name: Compilar TapBoard.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o TapBoard.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: TapBoard-${{ github.ref_name }}-${{ github.run_number }}
          path: TapBoard.exe
          retention-days: 14
